name: MusicApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  MusicApp:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ma Musique
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicapp
